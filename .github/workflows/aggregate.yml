name: Compile Field Surveys and Pivot Registry

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Geospatial Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas shapely

      - name: Auto-Detect Shapefile and Convert
        run: |
          # Detect shapefile (handles spaces and parentheses like 'Existing Polygons (DC).shp')
          SHP_FILE=$(find . -not -path '*/.*' -name "*.shp" | head -n 1)

          if [ -n "$SHP_FILE" ]; then
            echo "Found shapefile at: $SHP_FILE"
            mkdir -p data/dist
            python scripts/convert_shapefile_to_geojson.py -i "$SHP_FILE" -o data/default_pivots.geojson
          else
            echo "No .shp file found."
          fi

      - name: Execute Survey Aggregator
        run: |
          mkdir -p data/surveys data/dist
          python scripts/aggregate.py

      - name: Commit and Push Deliverables
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile field datasets and spatial layers [skip ci]"
          file_pattern: "data/default_pivots.geojson data/dist/*"
