name: Compile Field Surveys and Pivot Registry

on:
  push:
    paths:
      - 'data/surveys/**.json'
      - 'data/raw_shp/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Geospatial Dependencies
        run: |
          pip install pandas geopandas shapely

      - name: Check for Raw Shapefile Updates
        run: |
          if [ -f "data/raw_shp/pivots.shp" ]; then
            echo "Recompiling shapefile to GeoJSON..."
            python scripts/convert_shapefile_to_geojson.py -i data/raw_shp/pivots.shp -o data/default_pivots.geojson
          fi

      - name: Execute Survey Aggregator
        run: |
          python scripts/aggregate.py

      - name: Commit & Push Consolidated Deliverables
        run: |
          git config --global user.name "Hydraulic CI Bot"
          git config --global user.email "ci-bot@field.local"
          git add data/dist/ data/default_pivots.geojson
          if git diff --staged --quiet; then
            echo "No changes detected in compiled artifacts."
          else
            git commit -m "Auto-compile field datasets and spatial layers [skip ci]"
            git push origin main
          fi
