name: Compile Field Surveys and Pivot Registry

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Geospatial Dependencies
        run: |
          pip install pandas geopandas shapely

      - name: Auto-Detect Shapefile and Convert
        run: |
          # Find any .shp file in the repo (handles spaces and parentheses)
          SHP_FILE=$(find . -not -path '*/.*' -name "*.shp" | head -n 1)

          if [ -n "$SHP_FILE" ]; then
            echo "Found shapefile: $SHP_FILE"
            mkdir -p data/dist
            python scripts/convert_shapefile_to_geojson.py -i "$SHP_FILE" -o data/default_pivots.geojson
          else
            echo "No .shp file found."
          fi

      - name: Execute Survey Aggregator
        run: |
          mkdir -p data/surveys data/dist
          python scripts/aggregate.py

      - name: Commit & Push Consolidated Deliverables
        run: |
          git config --global user.name "Hydraulic CI Bot"
          git config --global user.email "ci-bot@field.local"
          git add data/default_pivots.geojson data/dist/
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto-compile field datasets and spatial layers [skip ci]"
            git push origin main
          fi
