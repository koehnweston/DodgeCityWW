<script>
        // --------------------------------------------------------------------
        // Global State & Baseline Inventory
        // --------------------------------------------------------------------
        let activePivots = [];
        let userLocation = null;
        let nearestPivot = null;
        let map, userMarker, pivotLayerGroup;

        // --------------------------------------------------------------------
        // Spatial Math: Geodesic Haversine & Sector Centers
        // --------------------------------------------------------------------
        function haversineFeet(lat1, lon1, lat2, lon2) {
            const R_ft = 20902231.0;
            const phi1 = lat1 * Math.PI / 180.0, phi2 = lat2 * Math.PI / 180.0;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180.0;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180.0;
            const a = Math.sin(deltaPhi / 2.0) ** 2 +
                      Math.cos(phi1) * Math.cos(phi2) * (Math.sin(deltaLambda / 2.0) ** 2);
            return 2.0 * R_ft * Math.atan2(Math.sqrt(a), Math.sqrt(1.0 - a));
        }

        // --------------------------------------------------------------------
        // Dynamic GeoJSON Asset Ingestion (Your Shapefile Output)
        // --------------------------------------------------------------------
        async function loadDynamicPivotRegistry() {
            try {
                // Fetch the compiled GeoJSON generated by GitHub Actions
                const resp = await fetch('data/default_pivots.geojson?t=' + Date.now());
                if (!resp.ok) throw new Error("No remote data/default_pivots.geojson found yet.");

                const geojson = await resp.json();
                const loadedPivots = [];

                geojson.features.forEach(feat => {
                    const p = feat.properties;
                    const coords = feat.geometry.coordinates; // [lon, lat]
                    loadedPivots.push({
                        id: p.id,
                        sn: p.sn || '',
                        status: p.status || 'Imported',
                        z_rel: p.z_rel || 6.5,
                        lat: coords[1],
                        lon: coords[0],
                        design_gpm: p.design_gpm || 800,
                        reg_psi: p.reg_psi || 15,
                        max_elev_diff: p.max_elev_diff || 10,
                        polygon: p.polygon_geometry || null
                    });
                });

                if (loadedPivots.length > 0) {
                    activePivots = loadedPivots;
                    populatePivotDropdown();
                    renderPivotMarkers();
                    
                    // Auto-zoom map to fit all pivots in your shapefile
                    if (pivotLayerGroup && pivotLayerGroup.getLayers().length > 0) {
                        const bounds = L.featureGroup(pivotLayerGroup.getLayers()).getBounds();
                        if (bounds.isValid()) {
                            map.fitBounds(bounds, { padding: [30, 30] });
                        }
                    }
                    console.log(`Successfully loaded ${loadedPivots.length} pivots from shapefile GeoJSON.`);
                }
            } catch (err) {
                console.warn("Could not load dynamic GeoJSON:", err.message);
            }
        }

        // --------------------------------------------------------------------
        // Map Rendering (Draws Polygons + Center Pad Nodes)
        // --------------------------------------------------------------------
        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.755, -100.02], 13);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
            pivotLayerGroup = L.layerGroup().addTo(map);
        }

        function renderPivotMarkers() {
            pivotLayerGroup.clearLayers();

            activePivots.forEach(p => {
                const color = p.status === 'Complete' ? '#10b981' : (p.status === 'Still Irrigating' ? '#a855f7' : '#38bdf8');

                // 1. Render Polygon Boundary Footprint (if present from shapefile)
                if (p.polygon) {
                    const polyLayer = L.geoJSON(p.polygon, {
                        style: {
                            color: color,
                            weight: 2,
                            fillColor: color,
                            fillOpacity: 0.25
                        }
                    });
                    polyLayer.bindTooltip(`<b>${p.id}</b>`);
                    polyLayer.on('click', () => selectAndBindPivot(p.id));
                    pivotLayerGroup.addLayer(polyLayer);
                }

                // 2. Render Physical Center Pad Pin (Transducer Tap)
                if (p.lat && p.lon) {
                    const padMarker = L.circleMarker([p.lat, p.lon], {
                        radius: 7,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 2,
                        fillOpacity: 1.0
                    });
                    padMarker.bindTooltip(`<b>${p.id} Pad</b><br>S/N: ${p.sn || 'None'}`);
                    padMarker.on('click', () => selectAndBindPivot(p.id));
                    pivotLayerGroup.addLayer(padMarker);
                }
            });
        }

        // --------------------------------------------------------------------
        // GPS Tracking & Proximity HUD
        // --------------------------------------------------------------------
        function startGpsTracking() {
            const statusPill = document.getElementById('gps-status-pill');
            const statusText = document.getElementById('gps-status-text');

            if (!("geolocation" in navigator)) {
                statusText.innerText = "No GPS Hardware";
                return;
            }

            navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = Math.round(pos.coords.accuracy * 3.28084);

                    userLocation = { lat, lon, acc };
                    statusPill.className = "status-pill active";
                    statusText.innerText = `GPS ±${acc} ft`;

                    if (!userMarker) {
                        userMarker = L.circleMarker([lat, lon], {
                            radius: 9, fillColor: '#38bdf8', color: '#ffffff', weight: 3, fillOpacity: 1
                        }).addTo(map);
                    } else {
                        userMarker.setLatLng([lat, lon]);
                    }
                    updateProximityHUD();
                },
                () => {
                    statusPill.className = "status-pill searching";
                    statusText.innerText = "GPS Searching";
                },
                { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
            );
        }

        function updateProximityHUD() {
            if (!userLocation) return;
            let minD = Infinity;
            let closest = null;

            activePivots.forEach(p => {
                if (p.lat && p.lon) {
                    const d = haversineFeet(userLocation.lat, userLocation.lon, p.lat, p.lon);
                    if (d < minD) { minD = d; closest = p; }
                }
            });

            nearestPivot = closest;
            const hudPivot = document.getElementById('hud-nearest-name');
            const hudDist = document.getElementById('hud-nearest-dist');
            const hudPanel = document.getElementById('hud-panel');
            const lockBtn = document.getElementById('btn-lock-pivot');

            if (closest) {
                hudPivot.innerText = closest.id;
                hudDist.innerText = `${Math.round(minD)} ft from Pad`;

                if (minD <= 300) {
                    hudPanel.style.borderColor = '#10b981';
                    lockBtn.innerText = "Lock & Calibrate";
                    lockBtn.style.background = "#10b981";
                    document.getElementById('auto-lock-indicator').innerText = "GPS Auto-Locked (<300 ft)";
                    document.getElementById('auto-lock-indicator').style.color = "#10b981";
                } else {
                    hudPanel.style.borderColor = '#38bdf8';
                    lockBtn.innerText = "View Form";
                    lockBtn.style.background = "#0284c7";
                    document.getElementById('auto-lock-indicator').innerText = "Manual";
                    document.getElementById('auto-lock-indicator').style.color = "#94a3b8";
                }
            }
        }

        function lockCurrentPivot() {
            if (nearestPivot) {
                selectAndBindPivot(nearestPivot.id);
                switchView('view-form');
            }
        }

        function selectAndBindPivot(pivotId) {
            const sel = document.getElementById('field-pivot-select');
            sel.value = pivotId;
            onPivotSelectionChanged();
        }

        function onPivotSelectionChanged() {
            const pId = document.getElementById('field-pivot-select').value;
            const found = activePivots.find(x => x.id === pId);
            if (found) {
                document.getElementById('field-trans-sn').value = found.sn || '';
                if (found.z_rel) {
                    document.getElementById('field-tap-height-in').value = (found.z_rel * 12.0).toFixed(1);
                }
                runLiveHydraulics();
            }
        }

        // --------------------------------------------------------------------
        // Hydraulic Calculation Engine
        // --------------------------------------------------------------------
        function runLiveHydraulics() {
            const pId = document.getElementById('field-pivot-select').value;
            const pivot = activePivots.find(x => x.id === pId) || { design_gpm: 800, reg_psi: 15, max_elev_diff: 10 };

            const tapHeightIn = parseFloat(document.getElementById('field-tap-height-in').value) || 0;
            const rawPsi = parseFloat(document.getElementById('field-gauge-psi').value) || 0;

            const datumCorrection = (tapHeightIn / 12.0) * 0.433127;
            const padPsi = rawPsi > 0 ? (rawPsi + datumCorrection) : 0;
            document.getElementById('diag-pad-psi').innerText = padPsi > 0 ? `${padPsi.toFixed(1)} PSI` : '-- PSI';

            const t1Val = document.getElementById('field-t1-time').value;
            const t2Val = document.getElementById('field-t2-time').value;
            const g1 = parseFloat(document.getElementById('field-t1-gal').value);
            const g2 = parseFloat(document.getElementById('field-t2-gal').value);

            let calculatedGpm = null;
            if (t1Val && t2Val && !isNaN(g1) && !isNaN(g2) && g2 > g1) {
                const [h1, m1] = t1Val.split(':').map(Number);
                const [h2, m2] = t2Val.split(':').map(Number);
                let dtMin = (h2 * 60 + m2) - (h1 * 60 + m1);
                if (dtMin <= 0) dtMin += 1440;

                if (dtMin > 0) {
                    calculatedGpm = (g2 - g1) / dtMin;
                    document.getElementById('diag-flow-gpm').innerText = `${Math.round(calculatedGpm)} GPM`;

                    const pctDiff = ((calculatedGpm - pivot.design_gpm) / pivot.design_gpm) * 100;
                    const tolElem = document.getElementById('diag-flow-tol');
                    if (Math.abs(pctDiff) <= 5.0) {
                        tolElem.innerHTML = `<span class="badge badge-pass">PASS (${pctDiff > 0 ? '+' : ''}${pctDiff.toFixed(1)}%)</span>`;
                    } else {
                        tolElem.innerHTML = `<span class="badge badge-fail">FAIL (${pctDiff > 0 ? '+' : ''}${pctDiff.toFixed(1)}%)</span>`;
                    }
                }
            } else {
                document.getElementById('diag-flow-gpm').innerText = '-- GPM';
                document.getElementById('diag-flow-tol').innerText = '--';
            }

            const marginElem = document.getElementById('diag-margin');
            if (padPsi > 0) {
                const qRatio = calculatedGpm ? (calculatedGpm / pivot.design_gpm) : 1.0;
                const dynamicHf = 7.0 * Math.pow(qRatio, 1.852);
                const topoHead = (pivot.max_elev_diff || 8.0) * 0.433127;
                const requiredMinPadPsi = (pivot.reg_psi || 15.0) + 4.0 + dynamicHf + topoHead;
                const marginDelta = padPsi - requiredMinPadPsi;

                if (marginDelta >= 0) {
                    marginElem.innerHTML = `<span class="badge badge-pass">OK (+${marginDelta.toFixed(1)} PSI)</span>`;
                } else {
                    marginElem.innerHTML = `<span class="badge badge-fail">DEFICIT (${marginDelta.toFixed(1)} PSI)</span>`;
                }
            } else {
                marginElem.innerText = '--';
            }
        }

        function handleLoggerCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                let foundPressures = [];
                let detectedSn = "";

                lines.forEach(l => {
                    const match = l.match(/CS-[0-9]{4,8}|B[0-9]{5}-B/i);
                    if (match && !detectedSn) detectedSn = match[0];
                    const parts = l.split(',');
                    if (parts.length >= 2) {
                        const val = parseFloat(parts[1]);
                        if (!isNaN(val) && val > 0 && val < 150) foundPressures.push(val);
                    }
                });

                if (foundPressures.length > 0) {
                    const avgPsi = foundPressures.reduce((a,b) => a+b, 0) / foundPressures.length;
                    document.getElementById('field-gauge-psi').value = avgPsi.toFixed(1);
                    if (detectedSn) document.getElementById('field-trans-sn').value = detectedSn;
                    runLiveHydraulics();
                    alert(`Parsed ${foundPressures.length} logged records. Average Tap PSI: ${avgPsi.toFixed(1)}`);
                }
            };
            reader.readAsText(file);
        }

        // --------------------------------------------------------------------
        // Cloud Sync & Local Storage
        // --------------------------------------------------------------------
        function saveCloudConfig() {
            localStorage.setItem("gh_owner", document.getElementById("cfg-gh-owner").value.trim());
            localStorage.setItem("gh_repo", document.getElementById("cfg-gh-repo").value.trim());
            localStorage.setItem("gh_token", document.getElementById("cfg-gh-token").value.trim());
            localStorage.setItem("gh_tech", document.getElementById("cfg-tech-name").value.trim());
            updateSyncPill();
        }

        function loadCloudConfig() {
            document.getElementById("cfg-gh-owner").value = localStorage.getItem("gh_owner") || "";
            document.getElementById("cfg-gh-repo").value = localStorage.getItem("gh_repo") || "";
            document.getElementById("cfg-gh-token").value = localStorage.getItem("gh_token") || "";
            document.getElementById("cfg-tech-name").value = localStorage.getItem("gh_tech") || "";
            updateSyncPill();
        }

        function updateSyncPill() {
            const hasAuth = !!localStorage.getItem("gh_token");
            const pill = document.getElementById("sync-status-pill");
            const text = document.getElementById("sync-status-text");

            if (hasAuth) {
                pill.className = "status-pill active";
                text.innerText = "Cloud Online";
            } else {
                pill.className = "status-pill";
                text.innerText = "Local Only";
            }
        }

        function submitFieldRecord() {
            const pId = document.getElementById('field-pivot-select').value;
            const sn = document.getElementById('field-trans-sn').value;
            const tapIn = parseFloat(document.getElementById('field-tap-height-in').value) || 0;
            const heading = parseFloat(document.getElementById('field-heading-deg').value) || 0;
            const gaugePsi = parseFloat(document.getElementById('field-gauge-psi').value) || 0;
            const padPsiStr = document.getElementById('diag-pad-psi').innerText;
            const flowGpmStr = document.getElementById('diag-flow-gpm').innerText;

            const record = {
                client_uuid: Date.now() + "_" + Math.random().toString(36).substring(2, 7),
                timestamp: new Date().toISOString(),
                technician: localStorage.getItem("gh_tech") || "Field Op",
                pivotId: pId,
                transducerSn: sn,
                tapHeightInches: tapIn,
                headingDeg: heading,
                rawGaugePsi: gaugePsi,
                calculatedPadPsi: parseFloat(padPsiStr) || 0,
                measuredFlowGpm: parseFloat(flowGpmStr) || 0,
                latitude: userLocation ? userLocation.lat : null,
                longitude: userLocation ? userLocation.lon : null
            };

            let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
            queue.push(record);
            localStorage.setItem('offline_queue', JSON.stringify(queue));

            let allSurveys = JSON.parse(localStorage.getItem('local_surveys') || '[]');
            allSurveys.push(record);
            localStorage.setItem('local_surveys', JSON.stringify(allSurveys));

            renderSurveyTable();
            alert(`Record for ${pId} preserved locally.`);
            syncOfflineQueueToGitHub();
            switchView('view-records');
        }

        async function syncOfflineQueueToGitHub() {
            let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
            const owner = localStorage.getItem("gh_owner");
            const repo = localStorage.getItem("gh_repo");
            const token = localStorage.getItem("gh_token");

            if (!owner || !repo || !token) return;
            if (queue.length === 0) return;

            const pill = document.getElementById("sync-status-pill");
            const text = document.getElementById("sync-status-text");
            pill.className = "status-pill pending";
            text.innerText = `Syncing (${queue.length})...`;

            const remaining = [];

            for (const item of queue) {
                const safeP = item.pivotId.replace(/[^a-zA-Z0-9-_]/g, '_');
                const safeT = item.timestamp.replace(/[:.]/g, '-');
                const filePath = `data/surveys/${safeP}_${safeT}_${item.client_uuid}.json`;

                const content = btoa(unescape(encodeURIComponent(JSON.stringify(item, null, 2))));
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;

                try {
                    const resp = await fetch(url, {
                        method: "PUT",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Accept": "application/vnd.github.v3+json",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: `Telemetry test ${item.pivotId} [ci skip]`,
                            content: content
                        })
                    });
                    if (!resp.ok) remaining.push(item);
                } catch (e) {
                    remaining.push(item);
                }
            }

            localStorage.setItem('offline_queue', JSON.stringify(remaining));
            pill.className = "status-pill active";
            text.innerText = remaining.length === 0 ? "Synced" : `Pending (${remaining.length})`;
            renderSurveyTable();
        }

        function renderSurveyTable() {
            const surveys = JSON.parse(localStorage.getItem('local_surveys') || '[]');
            const queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
            const tbody = document.getElementById('survey-log-tbody');
            document.getElementById('record-count-badge').innerText = `${surveys.length} Local`;
            tbody.innerHTML = '';

            surveys.forEach(s => {
                const isPending = queue.some(q => q.client_uuid === s.client_uuid);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:700; color:#38bdf8;">${s.pivotId}</td>
                    <td>${Math.round(s.measuredFlowGpm)} GPM</td>
                    <td>${s.calculatedPadPsi.toFixed(1)} PSI</td>
                    <td><span class="badge ${isPending ? 'badge-fail' : 'badge-pass'}">${isPending ? 'Pending' : 'Pushed'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportLocalCSV() {
            const surveys = JSON.parse(localStorage.getItem('local_surveys') || '[]');
            if (surveys.length === 0) return alert("No surveys to export.");

            let csv = "Timestamp,Technician,Pivot ID,Transducer SN,Tap Height (in),Azimuth,Tap PSI,Pad Datum PSI,Flow GPM\n";
            surveys.forEach(s => {
                csv += `"${s.timestamp}","${s.technician}","${s.pivotId}","${s.transducerSn}",${s.tapHeightInches},${s.headingDeg},${s.rawGaugePsi},${s.calculatedPadPsi},${s.measuredFlowGpm}\n`;
            });

            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            link.setAttribute("download", `Field_Surveys_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearLocalStorage() {
            if (confirm("Erase local device survey logs?")) {
                localStorage.removeItem('local_surveys');
                localStorage.removeItem('offline_queue');
                renderSurveyTable();
            }
        }

        // --------------------------------------------------------------------
        // UI Tabs & Selectors
        // --------------------------------------------------------------------
        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            if (viewId === 'view-map') {
                document.getElementById('tab-nav-map').classList.add('active');
                setTimeout(() => map.invalidateSize(), 200);
            } else if (viewId === 'view-form') {
                document.getElementById('tab-nav-form').classList.add('active');
            } else if (viewId === 'view-records') {
                document.getElementById('tab-nav-records').classList.add('active');
            }
        }

        function populatePivotDropdown() {
            const sel = document.getElementById('field-pivot-select');
            sel.innerHTML = '';
            activePivots.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = `${p.id} (${p.sn || 'No S/N'})`;
                sel.appendChild(opt);
            });
            onPivotSelectionChanged();
        }

        function setDefaultTimes() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('field-t2-time').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            const past = new Date(now.getTime() - 30 * 60000);
            document.getElementById('field-t1-time').value = `${pad(past.getHours())}:${pad(past.getMinutes())}`;
        }

        // --------------------------------------------------------------------
        // App Lifecycle Bootstrapping
        // --------------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadCloudConfig();
            populatePivotDropdown();
            startGpsTracking();
            renderSurveyTable();
            setDefaultTimes();
            
            // Load your uploaded shapefile GeoJSON dynamically
            loadDynamicPivotRegistry();

            window.addEventListener('online', syncOfflineQueueToGitHub);
        });
    </script>
